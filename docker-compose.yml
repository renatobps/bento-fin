services:
  postgres:
    image: postgres:16-alpine
    container_name: bento-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: bento
    volumes:
      - bento_pg_data:/var/lib/postgresql/data

volumes:
  bento_pg_data:
